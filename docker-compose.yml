# Infrastructure locale de développement.
# Volontairement neutre : rien ici ne dépend d'un hébergeur particulier.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: couloir
      POSTGRES_PASSWORD: couloir
      POSTGRES_DB: couloir
    # 5432 est souvent déjà pris par un autre projet sur la machine :
    # on expose ailleurs pour ne rien perturber.
    ports: ["5442:5432"]
    # Montage lié, pas volume nommé : `docker compose down -v` ne l'efface
    # donc pas. Pour repartir de zéro, `pnpm demo --neuf` supprime le
    # dossier lui-même.
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couloir"]
      interval: 5s
      retries: 10

# Deux services ont été retirés d'ici, parce qu'aucune ligne de code ne les
# appelait et que `infra:up` les démarrait quand même :
#
#   mosquitto — le canal temps réel passe par HTTP (voir protocol/commands.ts).
#               Même port, même certificat, même signature que le reste, et ça
#               traverse les mandataires d'un réseau d'école sans rien demander.
#
#   minio     — les médias sont sur disque. `MediaStore` est écrit pour qu'un
#               stockage compatible S3 ne change que cette classe ; le jour où
#               ce sera utile, le service reviendra avec le code qui s'en sert.
