<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Couloir — écran de démonstration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e0d; font-family: Archivo, sans-serif }
      body { display: grid; grid-template-rows: auto 1fr; }
      .bar {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 10px 14px; background: #171c1a; color: #a8b2ac;
        font-size: 12px; letter-spacing: .04em;
      }
      .bar strong { color: #54be95; letter-spacing: .12em; text-transform: uppercase; font-size: 10px }
      button {
        font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 5px; cursor: pointer;
        background: #232927; color: #e7ebe7; border: 1px solid #333b38;
      }
      button:hover { border-color: #54be95; color: #54be95 }
      button[aria-pressed="true"] { background: #54be95; color: #06120e; border-color: #54be95 }
      #state { margin-left: auto; font-variant-numeric: tabular-nums }
      .stage { position: relative; margin: 16px; border-radius: 6px; overflow: hidden; background: #000 }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>Écran A·1·12</strong>
      <button id="btn-normal" aria-pressed="true">Normal</button>
      <button id="btn-stale">Emploi du temps périmé</button>
      <button id="btn-emergency">Urgence</button>
      <button id="btn-identify">Identifier</button>
      <button id="btn-fallback">Repli hors ligne</button>
      <button id="btn-off">Extinction</button>
      <span id="state"></span>
    </div>
    <div class="stage" id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
