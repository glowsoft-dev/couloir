# Vérification à chaque poussée.
#
# Les tests ont besoin d'une vraie base : ceux qui portent sur la persistance
# se taisent silencieusement quand PostgreSQL est absent, ce qui est
# confortable en local et dangereux ici. On la fournit donc toujours.
name: vérification

on:
  push:
    branches: [main]
  pull_request:
  # Relançable à la main : sans ça, la seule façon de rejouer la vérification
  # était de pousser un commit, ce qui salit l'historique pour éprouver
  # l'outillage.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: couloir
          POSTGRES_PASSWORD: couloir
          POSTGRES_DB: couloir
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U couloir"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgres://couloir:couloir@localhost:5442/couloir_test
      DATABASE_URL: postgres://couloir:couloir@localhost:5442/couloir

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: types
        run: pnpm exec tsc --build

      - name: tests
        run: pnpm test

      # Le paquet navigateur et la console sont servis en fichiers statiques :
      # une erreur de construction ne se voit qu'à l'exécution, sur un écran
      # posé à quatre mètres de haut. On les construit ici.
      - name: paquets servis au navigateur
        run: pnpm build:browser && pnpm build:console

  image:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Le serveur tourne sur un Raspberry : arm64. Les exécuteurs GitHub sont
      # en amd64, et sans cette émulation on publierait une image que la
      # machine cible refuse d'exécuter — avec un message qui ne dit pas
      # pourquoi.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: connexion au registre
        # Sur une branche de contribution extérieure, le jeton est en lecture
        # seule : on construit sans publier plutôt que d'échouer.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: étiquettes
        id: etiquettes
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/serveur
          # `sha` sert à épingler une version précise ; `main` est ce que le
          # serveur suit s'il se met à jour tout seul.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.etiquettes.outputs.tags }}
          labels: ${{ steps.etiquettes.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
