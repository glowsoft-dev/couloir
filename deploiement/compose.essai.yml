# Un serveur d'essai, sans terminaison TLS.
#
#   docker compose --env-file .env -f compose.yml -f compose.essai.yml up -d
#
# Sert à éprouver l'installation avant que le nom de domaine ne résolve : sur
# place, l'adresse fixe du serveur n'est parfois connue qu'au dernier moment,
# et attendre le DNS pour découvrir qu'un paquet manque coûte une journée.
#
# Ce que ça retire, et pourquoi ce n'est pas anodin :
#
#   - Le mot de passe de la console circule en clair sur le réseau. Sur un
#     réseau d'école, où des élèves sont branchés, ce n'est acceptable que le
#     temps d'un essai.
#   - Le cookie de session n'est plus marqué `Secure`, donc lisible lui aussi.
#
# À ne jamais laisser en place après la mise en service. Le passage à HTTPS
# suppose de reprendre l'adresse inscrite dans chaque écran : autant ne pas
# poser d'écran avant que le certificat ne fonctionne.

services:
  serveur:
    # Le port sort directement, puisqu'il n'y a plus de Caddy devant.
    ports: ["3000:3000"]

  # Neutralisée : sans nom de domaine, elle tournerait en boucle sur une
  # demande de certificat qu'elle ne peut pas obtenir, et remplirait le
  # journal d'erreurs sans rapport avec ce qu'on cherche à vérifier.
  tls:
    profiles: ["jamais"]
