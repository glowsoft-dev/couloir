# Un serveur d'essai, sans terminaison TLS.
#
#   docker compose --env-file .env --env-file essai.env \
#     -f compose.yml -f compose.essai.yml up -d
#
# Les deux fichiers d'environnement sont nécessaires. `essai.env` ne contient
# aucun secret : il remplit les quatre variables du service TLS, que Compose
# exige d'interpoler même quand le service est hors profil et ne sera jamais
# créé. Sans lui, le mode d'essai refuse de démarrer.
#
# Sert à éprouver l'installation avant que le nom de domaine ne résolve : sur
# place, l'adresse fixe du serveur n'est parfois connue qu'au dernier moment,
# et attendre le DNS pour découvrir qu'un paquet manque coûte une journée.
#
# Ce que ça retire, et pourquoi ce n'est pas anodin :
#
#   - Le mot de passe de la console circule en clair sur le réseau. Sur un
#     réseau d'école, où des élèves sont branchés, ce n'est acceptable que le
#     temps d'un essai.
#   - Le cookie de session n'est plus marqué `Secure`, donc lisible lui aussi.
#
# À ne jamais laisser en place après la mise en service. Le passage à HTTPS
# suppose de reprendre l'adresse inscrite dans chaque écran : autant ne pas
# poser d'écran avant que le certificat ne fonctionne.

services:
  serveur:
    # Le port sort directement, puisqu'il n'y a plus de Caddy devant.
    ports: ["3000:3000"]
    environment:
      # L'adresse inscrite dans les manifestes, et donc celle par laquelle les
      # écrans iront chercher leurs médias.
      #
      # `compose.yml` la déduit du domaine en https. Sans cette ligne, un
      # essai en clair produirait des manifestes pointant vers une adresse en
      # https qui ne répond pas — les écrans resteraient sur leur contenu
      # précédent, et rien dans la console ne le signalerait.
      COULOIR_PUBLIC_URL: ${COULOIR_PUBLIC_URL:?indiquez COULOIR_PUBLIC_URL, par exemple http://10.0.0.5:3000}
      # Hors HTTPS, un cookie `Secure` n'est tout simplement pas posé par le
      # navigateur, et la console deviendrait impossible à utiliser.
      COULOIR_COOKIE_NON_SECURISE: "1"

  # Neutralisée : sans nom de domaine, elle tournerait en boucle sur une
  # demande de certificat qu'elle ne peut pas obtenir, et remplirait le
  # journal d'erreurs sans rapport avec ce qu'on cherche à vérifier.
  tls:
    profiles: ["jamais"]
